[project]
name = "pongai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "azure-storage-blob>=12.23",
  "azure-storage-queue>=12.12",
  "azure-data-tables>=12.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
worker = ["ultralytics", "opencv-python-headless", "numpy", "pandas", "tqdm"]
dev = ["pytest", "httpx", "ruff", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pongai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
